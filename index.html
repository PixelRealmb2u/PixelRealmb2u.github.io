<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Realm | Minecraft Bedrock Mods</title>
<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#030914;
    color:white;
    overflow-x:hidden;
}

/* پس زمینه */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;
    background:radial-gradient(circle at 50% 10%,#08275c 0%,transparent 35%),radial-gradient(circle at 10% 70%,#061c38 0%,transparent 30%),#030914;
}

/* هدر */
header{
    position:relative;
    padding:45px 20px 35px;
    text-align:center;
    background:linear-gradient(135deg,#06347a,#0755c7);
    border-bottom:3px solid #2196ff;
    border-radius:0 0 28px 28px;
    box-shadow:0 10px 40px #0008;
}

.logo{
    color:#42a5ff;
    font-size:38px;
    font-weight:900;
    margin-bottom:8px;
}

.subtitle{
    font-size:18px;
    color:#d7e9ff;
}

/* دکمه جستجو */
.search-btn{
    position:absolute;
    left:18px;
    top:18px;
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:#081528;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 18px #0008;
    transition:.25s;
}

.search-btn:hover{
    transform:scale(1.08);
    background:#102744;
}

.search-btn svg{
    width:24px;
    height:24px;
}

/* پنجره جستجو */
.search-overlay{
    position:fixed;
    inset:0;
    background:#0009;
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:9998;
}

.search-overlay.active{
    opacity:1;
    visibility:visible;
}

.search-drawer{
    position:fixed;
    top:0;
    right:-390px;
    width:min(390px,92%);
    height:100vh;
    background:#06101f;
    border-left:2px solid #1976d2;
    box-shadow:-10px 0 40px #000b;
    z-index:9999;
    transition:right .35s ease;
    padding:20px;
    overflow-y:auto;
}

.search-drawer.active{
    right:0;
}

.search-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.search-header h2{
    color:#42a5ff;
    font-size:24px;
}

.search-close{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#12233a;
    color:white;
    font-size:24px;
    cursor:pointer;
}

.search-input-wrap{
    position:relative;
    margin-bottom:20px;
}

.search-input{
    width:100%;
    padding:15px 18px;
    border-radius:14px;
    border:1px solid #1976d2;
    outline:none;
    background:#0a192d;
    color:white;
    font-size:17px;
    font-family:Arial,Tahoma,sans-serif;
}

.search-input::placeholder{
    color:#8193ac;
}

.search-results{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.search-result{
    display:block;
    padding:16px;
    border-radius:15px;
    background:#0a192d;
    border:1px solid #12365b;
    color:white;
    text-decoration:none;
    line-height:1.8;
    transition:.2s;
}

.search-result:hover{
    border-color:#2196ff;
    transform:translateX(-3px);
}

.search-message{
    text-align:center;
    color:#8193ac;
    padding:25px 10px;
    line-height:2;
}

/* محتوای اصلی */
.container{
    width:min(920px,92%);
    margin:auto;
}

.welcome{
    text-align:center;
    padding:45px 15px 25px;
}

.welcome h1{
    font-size:30px;
    margin-bottom:18px;
}

.welcome p{
    color:#b9c9df;
    font-size:18px;
    line-height:2;
}

/* تلگرام اصلی */
.telegram-main{
    display:block;
    width:min(500px,90%);
    margin:25px auto 45px;
    padding:19px;
    border-radius:18px;
    text-decoration:none;
    color:white;
    font-size:20px;
    font-weight:bold;
    background:#229ED9;
    box-shadow:0 0 30px #229ed955;
    transition:.25s;
}

.telegram-main:hover{
    transform:translateY(-4px);
}

/* شبکه های اجتماعی */
.social-title{
    text-align:center;
    color:#42a5ff;
    font-size:27px;
    margin:25px 0;
}

.socials{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:55px;
}

.social{
    min-height:125px;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:12px;
    color:white;
    text-decoration:none;
    font-weight:bold;
    font-size:17px;
    transition:.25s;
    border:2px solid;
    background:#081528;
}

.social svg{
    width:43px;
    height:43px;
}

.social:hover{
    transform:translateY(-7px) scale(1.02);
}

/* تلگرام */
.telegram{
    border-color:#229ED9;
    box-shadow:0 0 18px #229ed933;
}

.telegram svg{
    fill:#229ED9;
}

/* اینستاگرام */
.instagram{
    border-color:#c13584;
    box-shadow:0 0 18px #c1358444;
}

.instagram svg{
    fill:url(#instaGradient);
}

/* یوتیوب */
.youtube{
    border-color:#ff1744;
    box-shadow:0 0 18px #ff174444;
}

.youtube svg{
    fill:#ff1744;
}

/* عنوان مودها */
.mods-title{
    text-align:center;
    color:#42a5ff;
    font-size:30px;
    margin:35px 0 25px;
}

/* کارت مود */
.mod-card{
    background:linear-gradient(145deg,#0a192d,#071221);
    border:1px solid #1976d2;
    border-radius:22px;
    padding:25px;
    margin-bottom:22px;
    box-shadow:0 8px 30px #0007;
}

.mod-card h2{
    font-size:23px;
    margin-bottom:12px;
}
